# 整套集成测试共用一个 embedded PG，并在每个测试前清表：只能顺序执行，显式关闭并行。
junit.jupiter.execution.parallel.enabled = false

# 测试纪律（test-quality.md）：单个测试 <= 1.5 分钟。
# 注意：默认 SAME_THREAD 模式只会中断测试线程，阻塞在 JDBC / HTTP socket 读上的测试不一定能被打断。
# 不改成 SEPARATE_THREAD：那会让 Spring 的测试事务（线程绑定）失效。阻塞类风险由各处显式超时兜住
# （清表 lock_timeout、HttpClient timeout、AD-10 的 lock_timeout）。
junit.jupiter.execution.timeout.default = 90 s
