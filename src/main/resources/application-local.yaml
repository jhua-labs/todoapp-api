# AD-14：本地开发 profile（只由 LocalDevApplication 激活）。
#
# 默认 todoapp.local-db.embedded=true：DataSource 只来自 LocalDbConfig（embedded PG 18.6，
# 固定端口 54329，数据目录 todoapp-api/.local-pg/ 持久保留），下面的 spring.datasource.* 不生效。
#
# brew 退路：启动时加 --todoapp.local-db.embedded=false，改连 brew PostgreSQL
# localhost:5432/todoapp（库须以 UTF8 创建）。任何密码都不提交。
todoapp:
  local-db:
    embedded: true

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/todoapp
    username: ${USER}
